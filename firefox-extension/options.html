<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rapiboy · Configuración</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <img src="icons/rapiboy-96.png" alt="" />
      <div>
        <h1>Herramientas Rapiboy</h1>
        <p>Estos valores quedan guardados solamente en este perfil de Firefox.</p>
      </div>

      <form id="form">
        <label>
          Operador
          <input id="operador" name="operador" autocomplete="name" placeholder="Nombre o correo" />
        </label>

        <label>
          URL del webhook de producción
          <input id="webhookUrl" name="webhookUrl" type="url" required />
        </label>

        <label>
          Token de n8n
          <input id="token" name="token" type="password" required autocomplete="off" />
        </label>

        <section class="bloque">
          <h2>Asistente</h2>
          <p>
            Generá tu vinculación en Plataforma → Mi perfil. El panel aparecerá solo en
            WhatsApp Web y páginas de Rapiboy.
          </p>

          <label>
            URL del Asistente
            <input
              id="assistantApiUrl"
              name="assistantApiUrl"
              type="url"
              placeholder="https://soporte.rapiboy.com/api/asistente/extension"
            />
          </label>

          <label>
            Token personal
            <input
              id="assistantToken"
              name="assistantToken"
              type="password"
              autocomplete="off"
              placeholder="rbx_…"
            />
          </label>
        </section>

        <div class="acciones">
          <button type="submit">Guardar</button>
          <span id="estado" role="status" aria-live="polite"></span>
        </div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
